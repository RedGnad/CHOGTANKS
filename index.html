<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CHOGTANKS - Monad Games ID Login</title>
  <style>
    :root{--bg:#200052;--panel-bg:rgba(251,250,249,0.92);--panel-text:#000;--btn:#A0055D;--btn-text:#FBFAF9}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;
      color:var(--panel-text)
    }
    .container{
      background:var(--panel-bg);
      padding:32px;
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,0.2);
      max-width:400px;
      width:90%;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      box-sizing:border-box;
    }
    #root{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box}
    #root > *{margin-left:auto;margin-right:auto;max-width:360px;width:100%;box-sizing:border-box;text-align:center}
    #root h1, #root .title, #root [role="heading"]{color:var(--panel-text) !important; text-align:center !important}
    #root button{background:var(--btn) !important;background-image:none !important;color:var(--btn-text) !important;border:none !important;padding:12px 24px !important;border-radius:12px !important;font-size:16px !important;cursor:pointer !important}
    #root button:hover{transform:translateY(-1px)}
  </style>
</head>
<body>
  <div class="container">
    <div id="root"></div>
  </div>

  <script>
    (function(){
      function fix(){
        var container = document.querySelector('.container');
        if(!container) return;
        var h1s = container.querySelectorAll('h1');
        if(h1s.length>1) h1s[0].remove();
        var items = container.querySelectorAll('div,section,form,header');
        items.forEach(function(el){
          el.style.marginLeft='auto';
          el.style.marginRight='auto';
          el.style.maxWidth='360px';
          el.style.boxSizing='border-box';
          el.style.textAlign='center';
        });
        var btns = container.querySelectorAll('button');
        btns.forEach(function(b){
          b.style.background='#A0055D';
          b.style.backgroundImage='none';
          b.style.color='#FBFAF9';
          b.style.border='none';
          b.style.padding='12px 24px';
          b.style.borderRadius='12px';
          b.style.cursor='pointer';
        });
      }
      var obs = new MutationObserver(function(){ fix(); });
      obs.observe(document.documentElement || document, {childList:true, subtree:true});
      document.addEventListener('DOMContentLoaded', function(){ fix(); setTimeout(fix,300); setTimeout(function(){ obs.disconnect(); },5000); });
    })();
  </script>

  <script type="module" crossorigin src="./assets/index-gDiq5l8I.js"></script>
</body>
</html>
